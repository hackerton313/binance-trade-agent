name: Binance Trade Agent

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Clone square-post skill
        run: |
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git /tmp/binance-skills
          ls -la /tmp/binance-skills/skills/binance/square-post/scripts/

      - name: Run agent
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: node scripts/main.js
