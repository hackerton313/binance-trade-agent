name: Binance Trade Agent

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Clone square-post skill
        run: |
          git clone --depth 1 https://github.com/binance/binance-skills-hub.git /tmp/binance-skills
          echo "=== محتويات المستودع ==="
          find /tmp/binance-skills -type f -name "*.mjs" | head -30
          echo "=== البحث عن square-post ==="
          find /tmp/binance-skills -type d -name "*square*" | head -10

      - name: Install skill dependencies
        run: |
          SKILL_DIR=$(find /tmp/binance-skills -type d -name "square-post" | head -1)
          if [ -n "$SKILL_DIR" ]; then
            echo "وجدت المهارة في: $SKILL_DIR"
            cd "$SKILL_DIR"
            if [ -f "package.json" ]; then
              npm install
            fi
          else
            echo "❌ لم يتم العثور على square-post"
          fi

      - name: Run agent
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: node scripts/main.js
